# release-plz opens a release PR that bumps the version when releasable commits land on
# main. It does not touch the changelog, which is written by hand. Publishing runs only
# from a manual dispatch of .github/workflows/release.yml, and only for a version that is
# not on crates.io yet.

[workspace]
semver_check = true
git_release_enable = true
pr_labels = ["release"]

[[package]]
name = "idbd"
changelog_path = "CHANGELOG.md"
changelog_update = false
git_tag_name = "v{{ version }}"

[[package]]
name = "idbd-lab"
release = false

[[package]]
name = "idbd-wasm"
release = false
