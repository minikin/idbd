# cargo-mutants configuration. Every exclusion states why it is not tested.

# nextest fails fast and kills a test that hangs (see .config/nextest.toml), so a
# mutant that makes an iterator or loop endless counts as caught, not as a timeout.
test_tool = "nextest"

# Optional features such as `serde` have their own tests, which only build with the
# feature enabled.
all_features = true

exclude_globs = [
  # The experiment binaries are exercised by full runs in scripts/coverage.sh, and their
  # outputs are committed under docs/results, where a changed number shows in review.
  # Unit tests do not run them, so every mutant there would be reported as missed.
  "crates/idbd-lab/src/bin/**",
]

exclude_re = [
  # Reads the real process arguments. Parsing is tested through `cli::parse`.
  "cli\\.rs.*replace arguments ->",
  # ORs disjoint bit ranges (exponent bits 52..=61, mantissa bits 0..=51), so `|` and
  # `^` produce identical bits for every input.
  "replace \\| with \\^ in Rng::uniform",
  # `abs > 0.0` versus `abs >= 0.0` only differs at zero, where both paths print "0.000"
  # after trailing zeros are trimmed to three decimals.
  "report\\.rs.*replace > with >= in magnitude",
  # `uniform() < p` versus `<=` only differs when a draw equals p exactly. Draws are
  # multiples of 2^-53 and p is 1/60 or 0, so this happens with probability 2^-53 per
  # draw at most and never in any tested or published run.
]
