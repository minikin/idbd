name: Demo

# Builds the story page and IDBD Explorer and deploys them to Cloudflare as the static
# Worker in wrangler.jsonc. Pushes to main deploy only when the repository variable
# DEPLOY_DEMO is "true". A manual run always deploys. Needs the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.

on:
  # Automatic triggers are off until the project is ready. Runs start by hand only.
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_DEMO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: just,wasm-bindgen@0.2.113
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --omit=dev
        working-directory: web
      - run: just web-site
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.152.0
          command: deploy
