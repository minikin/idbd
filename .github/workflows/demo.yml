name: Demo

# Builds IDBD Explorer and deploys it to GitHub Pages. Pushes to main deploy only when
# the repository variable DEPLOY_DEMO is "true". A manual run always deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_DEMO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: just,wasm-bindgen@0.2.113
      - run: just web-build
      # Only the files the page loads. Tests, tooling and anything outside web/ stay out.
      - name: Assemble the site
        run: |
          mkdir -p _site/pkg
          cp web/index.html web/styles.css _site/
          cp -R web/src _site/src
          cp web/pkg/idbd_wasm.js web/pkg/idbd_wasm_bg.wasm _site/pkg/
          find _site -type f | sort
          ! find _site -iname '*internal*' | grep .
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
