name: Mutation testing

# The full run takes several minutes, so it runs weekly and on demand rather than on
# every pull request. Pull requests test mutants in their own diff (see ci.yml).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [idbd, idbd-lab]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: cargo mutants -p ${{ matrix.package }} --timeout 60 --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-${{ matrix.package }}
          path: mutants.out
