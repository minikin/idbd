name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - name: Allocation test in release mode
        run: cargo test -p idbd --release --test allocation

  msrv:
    name: Minimum Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p idbd --all-features

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
      - run: cargo test -p idbd --doc

  package:
    name: Package the core crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The core has no runtime dependencies
        run: |
          deps=$(cargo tree -p idbd -e normal,build --prefix none | sort -u)
          echo "$deps"
          test "$(echo "$deps" | wc -l)" -eq 1
      - name: Package contents exclude private and non-crate files
        run: |
          cargo package -p idbd --list | tee package-files.txt
          ! grep -E '(^|/)(internal|web|docs|features|target)/' package-files.txt
      - run: cargo publish -p idbd --dry-run

  coverage:
    name: Coverage and CRAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-crap@0.9.0
      - run: cargo llvm-cov --workspace --exclude idbd-wasm --lcov --output-path lcov.info
      - run: cargo llvm-cov report --workspace --exclude idbd-wasm --summary-only
      - name: No production function above CRAP 30
        run: cargo crap --workspace --lcov lcov.info --threshold 30 --fail-above --format github
      - name: No CRAP regression against the committed baseline
        run: cargo crap --workspace --lcov lcov.info --baseline quality/crap-baseline.json --fail-regression
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  mutants-diff:
    name: Mutation testing of changed code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: git diff origin/${{ github.base_ref }}... -- crates/idbd crates/idbd-lab > pr.diff
      - run: cargo mutants --in-diff pr.diff -p idbd -p idbd-lab --timeout 60 --no-shuffle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-diff
          path: mutants.out

  web:
    name: WebAssembly build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just,wasm-bindgen@0.2.113
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: just web-build
      - name: The core stays free of WASM dependencies
        run: |
          ! cargo tree -p idbd -e normal | grep -E 'wasm-bindgen|js-sys'
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
