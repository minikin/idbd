[package]
name = "idbd"
description = "Incremental Delta-Bar-Delta (Sutton 1992): a linear online learner that adapts one step size per input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/idbd"
keywords = ["online-learning", "meta-learning", "step-size", "lms", "idbd"]
categories = ["science", "algorithms", "mathematics"]
include = ["src/**/*.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
# Serialize and deserialize `Config`, `Bounds`, `State` and `Idbd` with serde.
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0.219", optional = true, default-features = false, features = ["std", "derive"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
exhaustive_enums = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"

[dev-dependencies]
proptest = "1.11.0"
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }

[package.metadata.docs.rs]
all-features = true
